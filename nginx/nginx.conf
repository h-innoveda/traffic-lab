# ─────────────────────────────────────────────────────────────────
# nginx.conf — Nginx reverse proxy + load balancer configuration
#
# Nginx sits in FRONT of the 3 Flask replicas.
# Every request from the UI hits Nginx first, then Nginx decides
# which replica to forward it to.
#
# DATA FLOW:
#   Browser → Nginx:80 → (load balance) → app-1:5000 / app-2:5000 / app-3:5000
# ─────────────────────────────────────────────────────────────────

# ── EVENTS BLOCK ───────────────────────────────────────────────
# Controls how Nginx handles connections at the OS level
events {
    worker_connections 1024;
    # Each Nginx worker can handle 1024 simultaneous connections.
    # For a lab this is more than enough.
}

# ── HTTP BLOCK ─────────────────────────────────────────────────
http {

    # ── MIME TYPES ────────────────────────────────────────────
    # Without this, Nginx serves .css and .js as application/octet-stream
    # and the browser refuses to apply them. This is the #1 cause of
    # "CSS not loading" when using a custom nginx.conf.
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── RATE LIMITING ─────────────────────────────────────────
    # limit_req_zone defines a "bucket" that tracks request rates.
    #
    # $binary_remote_addr = track by client IP address
    #   (binary = compact storage, saves memory vs string IP)
    # zone=api_limit:10m = name this zone "api_limit", allocate 10MB
    #   (10MB can track ~160,000 unique IPs)
    # rate=20r/s = allow max 20 requests per second per IP
    #
    # EXPERIMENT: Change 20r/s to 2r/s, click "Burst Traffic" in UI,
    # watch 429 Too Many Requests errors appear in Grafana.
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

    # ── UPSTREAM BLOCK ────────────────────────────────────────
    # "upstream" = a pool of backend servers Nginx can forward to.
    # The name "flask_app" is used below in proxy_pass.
    #
    # LOAD BALANCING ALGORITHM:
    # Default (no directive) = round-robin: app-1, app-2, app-3, app-1, app-2...
    #
    # EXPERIMENT OPTIONS — uncomment one at a time:
    #   least_conn;   → send to whichever replica has fewest active connections
    #                   (better for slow endpoints like /api/slow)
    #   ip_hash;      → same client IP always goes to same replica
    #                   (useful for session stickiness)
    #   random;       → random selection (good for stateless APIs)
    upstream flask_app {
        # Default: round-robin (no directive needed)
        # least_conn;   ← uncomment to switch algorithm

        # Each "server" line is one replica.
        # Docker Compose DNS resolves "app-1", "app-2", "app-3"
        # to the correct container IPs automatically.
        server app-1:5000;
        server app-2:5000;
        server app-3:5000;

        # EXPERIMENT: Comment out app-3, restart Nginx, watch Grafana
        # show only app-1 and app-2 handling traffic.
        # server app-3:5000;  ← comment this line to remove replica 3
    }

    # ── SERVER BLOCK ──────────────────────────────────────────
    # A "server" block = one virtual host (like a website config)
    server {
        listen 80;          # Listen on port 80 (standard HTTP)
        server_name _;      # _ = match any hostname (catch-all)

        # ── ACCESS LOG FORMAT ─────────────────────────────────
        # Log every request Nginx handles.
        # These logs go to stdout → Docker captures them.
        # Format: IP - [time] "METHOD /path HTTP/1.1" status bytes
        access_log /var/log/nginx/access.log;
        error_log  /var/log/nginx/error.log warn;

        # ── LOCATION: Serve CSS / JS / static assets ─────────
        # Must be BEFORE the catch-all location / block.
        # Serves .css, .js, images directly with correct MIME type.
        # try_files $uri =404 means: serve the file or return 404.
        # Do NOT fall back to index.html for static assets —
        # that would send HTML with Content-Type: text/css which
        # makes the browser silently ignore the stylesheet.
        location ~* \.(css|js|ico|png|jpg|jpeg|gif|svg|woff|woff2|ttf)$ {
            root  /usr/share/nginx/html;
            try_files $uri =404;
            expires 1h;
            add_header Cache-Control "public";
        }

        # ── LOCATION: Serve the UI ────────────────────────────
        # Catch-all for HTML pages only (after static assets matched above).
        location / {
            root  /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # ── LOCATION: Proxy API calls ─────────────────────────
        # Any request starting with /api/ or /health gets forwarded
        # to one of the Flask replicas.
        location ~ ^/(api|health) {
            
            # Apply rate limiting defined above.
            # burst=10 = allow a burst of 10 extra requests before rejecting
            # nodelay = don't queue burst requests, process them immediately
            limit_req zone=api_limit burst=10 nodelay;

            # Forward the request to the upstream pool (load balanced)
            proxy_pass http://flask_app;

            # Pass the real client IP to Flask (otherwise Flask sees Nginx's IP)
            proxy_set_header X-Real-IP        $remote_addr;
            proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
            proxy_set_header Host             $host;

            # Timeouts — how long to wait for Flask to respond
            proxy_connect_timeout 5s;    # time to establish connection
            proxy_send_timeout    30s;   # time to send request
            proxy_read_timeout    30s;   # time to wait for response
                                         # /api/slow takes up to 3s, so 30s is safe

            # Add CORS headers so browser doesn't block the response
            add_header Access-Control-Allow-Origin  *;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type";
        }

        # ── CUSTOM ERROR PAGES ────────────────────────────────
        # When rate limit is hit, return JSON instead of Nginx's default HTML
        error_page 429 /429.json;
        location = /429.json {
            internal;
            return 429 '{"error":"rate_limit_exceeded","message":"Too many requests, slow down"}';
            add_header Content-Type application/json;
        }
    }
}
