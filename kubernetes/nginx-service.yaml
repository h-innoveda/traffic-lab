# ─────────────────────────────────────────────────────────────────
# nginx-service.yaml — Nginx Service (exposes to browser)
#
# TYPE: NodePort
#   Exposes the service on a port on every cluster node.
#   Your browser can reach it at: http://localhost:30080
#
# In production you'd use:
#   LoadBalancer → cloud provider creates an external load balancer
#   Ingress      → more flexible routing (path-based, host-based)
# ─────────────────────────────────────────────────────────────────

apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: traffic-lab
  labels:
    app: nginx

spec:
  selector:
    app: nginx   # Route to Nginx pods

  ports:
    - name:       http
      protocol:   TCP
      port:       80          # Service port (internal)
      targetPort: 80          # Pod port
      nodePort:   30080       # External port on the node
                              # Access at: http://localhost:30080
                              # Range: 30000-32767

  type: NodePort   # Accessible from outside the cluster
