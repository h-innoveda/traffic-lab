# ─────────────────────────────────────────────────────────────────
# loki-deployment.yaml — Loki + Service
#
# Combines Deployment and Service in one file (separated by ---)
# This is valid YAML — kubectl apply handles multiple documents.
# ─────────────────────────────────────────────────────────────────

apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: traffic-lab
  labels:
    app: loki

spec:
  replicas: 1   # Loki single-instance for lab

  selector:
    matchLabels:
      app: loki

  template:
    metadata:
      labels:
        app: loki
    
    spec:
      containers:
        - name: loki
          image: grafana/loki:2.9.4
          
          args:
            - -config.file=/etc/loki/local-config.yaml
          
          ports:
            - containerPort: 3100
          
          resources:
            requests:
              memory: "128Mi"
              cpu:    "100m"
            limits:
              memory: "512Mi"
              cpu:    "500m"
          
          volumeMounts:
            - name: loki-config
              mountPath: /etc/loki/local-config.yaml
              subPath: config.yaml
            - name: loki-storage
              mountPath: /loki
      
      volumes:
        - name: loki-config
          configMap:
            name: loki-config   # You'd create a ConfigMap from loki/config.yaml
        - name: loki-storage
          emptyDir: {}          # In production: PersistentVolumeClaim

---
# Loki Service — internal DNS for Promtail and Grafana
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: traffic-lab
spec:
  selector:
    app: loki
  ports:
    - port:       3100
      targetPort: 3100
  type: ClusterIP
